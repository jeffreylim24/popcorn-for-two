# Load-test copy of fly.toml (#21): same image and VM size as production,
# on its own app that nobody uses. Deploy with
#   fly deploy --config fly.load.toml --ha=false
# and destroy the app when done: fly apps destroy popcorn-for-two-load
#
# Keep [http_service] and [[vm]] in step with fly.toml, or the numbers
# stop describing production.

app = 'popcorn-for-two-load'
primary_region = 'yyz'

[build]

# Fake TURN, per-IP limits off. Not a secret, and it only lives in this
# file; the server refuses LOAD_TEST=1 on the production app anyway.
[env]
  LOAD_TEST = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
